<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noční krém s levandulí</title>
<link rel="canonical" href="https://www.vzorovy-obchod.cz/nocni-krem/">
<link rel="stylesheet" href="/shop.css">
<script>window.shoptet = { config: {} };</script>
<script async src="/widget.js" data-shop="demo" data-base=""></script>
</head>
<body class="type-product type-detail">
<div class="dev-bar">
  <a href="/">← stránky</a>
  <button data-f="tiles" aria-pressed="true">Dlaždice</button>
  <button data-f="circles">Kroužky</button>
  <button data-f="single">Jedno video</button>
  <output>čekám na událost…</output>
</div>
<header>Vzorový obchod</header>
<div class="p-detail-inner">
  <div class="p-detail-inner-header"><h1>Noční krém s levandulí</h1></div>
  <form action="/action/Cart/addCartItem/" method="post" id="product-detail-form" data-testid="formProduct">
    <input type="hidden" name="productId" value="1082">
    <input type="hidden" name="priceId" value="5501">
    <div class="product-top">
      <div class="p-image-wrapper"><div class="p-image" data-testid="mainImage"><a class="p-main-image"><img src="/media/kosm-2.jpg" alt=""></a></div></div>
      <div class="p-info-wrapper">
        <div class="p-final-price-wrapper"><strong class="price-final" data-testid="productCardPrice"><span class="price-final-holder">349 Kč</span></strong></div>
        
        <div class="add-to-cart" data-testid="divAddToCart">
          <input type="number" name="amount" value="1" class="amount" data-testid="cartAmount">
          <button type="submit" class="btn btn-lg btn-conversion add-to-cart-button" data-testid="buttonAddToCart">Přidat do košíku</button>
        </div>
        <div class="p-short-description" data-testid="productCardShortDescr"><p>Lehký noční krém pro normální a suchou pleť. Rychle se vstřebá a nezanechává mastný film.</p></div>
      </div>
    </div>
  </form>
  <div style="height:120vh"></div>
</div>
<script src="/dev.js"></script>
</body>
</html>
