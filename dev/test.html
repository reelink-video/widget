<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget na e-shopech · test</title>
<style>
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #f2f1ee; color: #1a1a1a; }
  header { padding: 16px 24px; background: #111; color: #fff; display: flex; gap: 16px; align-items: baseline; }
  header h1 { margin: 0; font-size: 18px; }
  header small { opacity: .7; }
  main { padding: 16px 24px; display: grid; gap: 20px; }
  .shop { background: #fff; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 14px; }
  .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .meta b { font-size: 15px; }
  .tag { padding: 2px 8px; border-radius: 999px; background: #eee; font-size: 12px; }
  .ok { background: #d9f2dd; } .bad { background: #fbd5d0; } .warn { background: #fff0b8; }
  .frame { overflow: hidden; border: 1px solid #ddd; border-radius: 8px; position: relative; background: #fafafa; }
  .frame iframe { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .desk { width: 640px; height: 420px; } .desk iframe { width: 1440px; height: 945px; transform: scale(.4444); }
  .mob { width: 195px; height: 420px; } .mob iframe { width: 390px; height: 840px; transform: scale(.5); }
  .frames { display: flex; gap: 12px; }
  a { color: inherit; }
  table { border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; }
</style>
</head>
<body>
<header><h1>Widget na e-shopech</h1><small>kontroluji… (asi 10 s na tři obchody)</small></header>
<main id="list">načítám…</main>
<script>
// Každou kopii otevře ve skrytém iframu na šířce desktopu (1440) a telefonu (390), počká, až se widget usadí,
// a přečte window.reelink.info(). Výsledky jdou do tabulky nahoře, pod ní náhledy na kliknutí.
const tag = (text, cls = "") => `<span class="tag ${cls}">${text}</span>`;
const WAIT = 8000;

async function probe(domain, width) {
  const f = document.createElement("iframe");
  f.style.cssText = `position:fixed;left:-5000px;top:0;width:${width}px;height:900px`;
  f.src = `/_real/${domain}/`;
  document.body.append(f);
  await new Promise((r) => { f.onload = r; setTimeout(r, 20000); });
  await new Promise((r) => setTimeout(r, WAIT));
  let out;
  try {
    const api = f.contentWindow.reelink;
    out = api && api.info ? { adapter: api.adapter, ...api.info() } : { error: "widget se neukázal" };
  } catch (e) {
    out = { error: String(e) };
  }
  f.remove();
  return out;
}

function cell(o) {
  if (o.error) return tag(o.error, "bad");
  const p = o.product || {};
  return [
    tag(o.spot === "wide" ? "mimo sloupec" : "ve sloupci", o.spot === "wide" ? "warn" : "ok"),
    tag("za ." + (o.after || "?")),
    o.line ? "" : tag("bez naší čáry"),
    tag(p.price || "cena ✗", p.price ? "ok" : "bad"),
    p.name ? "" : tag("název ✗", "bad"),
    p.img ? "" : tag("foto ✗", "bad"),
    p.needsVariant ? tag("výběr varianty") : "",
  ].join(" ");
}

async function main() {
  const res = await fetch("/_real/shops.json", { cache: "no-store" });
  const shops = res.ok ? await res.json() : [];
  const list = document.getElementById("list");
  if (!shops.length) { list.textContent = "Zatím žádné kopie. Spusťte node scripts/snapshot.mjs domena.cz"; return; }
  list.innerHTML = `<table><thead><tr><th>E-shop</th><th>Šablona</th><th>Desktop</th><th>Telefon</th></tr></thead><tbody></tbody></table><div id="previews"></div>`;
  const body = list.querySelector("tbody");
  const rows = shops.map((s) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><a href="/_real/${s.domain}/" target="_blank">${s.domain}</a> · <a href="/mobile.html?u=/_real/${s.domain}/" target="_blank">telefon</a> · <a href="${s.url}" target="_blank" rel="noopener">originál</a></td><td>${s.template}</td><td>…</td><td>…</td>`;
    body.append(tr);
    return tr;
  });
  // po třech obchodech naráz, ať prohlížeč nezamrzne
  for (let k = 0; k < shops.length; k += 3) {
    await Promise.all(shops.slice(k, k + 3).map(async (s, j) => {
      const tr = rows[k + j];
      const [d, m] = await Promise.all([probe(s.domain, 1440), probe(s.domain, 390)]);
      tr.children[2].innerHTML = cell(d);
      tr.children[3].innerHTML = cell(m);
    }));
  }
  document.querySelector("header small").textContent = "hotovo";
}
main();
</script>
</body>
</html>
