# Release: push a tag v1.2.3 (same number as in package.json).
# After the checks it builds widget.js, signs it (build provenance via Sigstore), creates a GitHub release
# and uploads it to the CDN as immutable widget@1.2.3.js and as widget.js. It also adds the version with its
# SHA-384 hash to versions.json, which reelink.cz/bezpecnost reads.
# Repository secrets: CLOUDFLARE_API_TOKEN (R2 write), CLOUDFLARE_ACCOUNT_ID.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  security-events: write

env:
  CDN: https://cdn.reelink.cz
  BUCKET: reelink-cdn

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(jq -r .version package.json)" ] || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"

      # a released version never changes: shops pinned with integrity="" would break otherwise
      # (query string bypasses the edge cache, otherwise Cloudflare caches this 404 for the real URL)
      - name: Version not published yet
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$CDN/widget@$V.js?check=$GITHUB_RUN_ID")
          [ "$code" = "404" ] || { echo "widget@$V.js already exists on the CDN ($code)"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Integrity hash
        run: echo "SRI=sha384-$(openssl dgst -sha384 -binary dist/widget.js | openssl base64 -A)" >> "$GITHUB_ENV"

      - name: Sign build
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/widget.js

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/widget.js --title "$GITHUB_REF_NAME" --notes "$(cat <<EOF
          Checks: CodeQL (security-extended), Semgrep, no runtime dependencies.

          \`\`\`html
          <script async src="$CDN/widget@$V.js" integrity="$SRI" crossorigin="anonymous" data-shop="YOUR-ID"></script>
          \`\`\`

          SHA-384: \`$SRI\`
          Signature: ${{ steps.attest.outputs.attestation-url }}
          EOF
          )"

      - name: Upload to CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() { npx --yes wrangler@4 r2 object put "$BUCKET/$1" --file "$2" --content-type "$3" --cache-control "$4" --remote; }
          put "widget@$V.js" dist/widget.js "application/javascript; charset=utf-8" "public, max-age=31536000, immutable"
          put "widget.js" dist/widget.js "application/javascript; charset=utf-8" "public, max-age=300"

          # versions.json: newest version first
          # bypass the edge cache: a stale copy would drop the previous version
          curl -sf "$CDN/versions.json?fresh=$GITHUB_RUN_ID" -o versions.json || echo "[]" > versions.json
          jq --arg v "$V" --arg sri "$SRI" --arg commit "$GITHUB_SHA" \
             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg url "$CDN/widget@$V.js" \
             --arg attestation "${{ steps.attest.outputs.attestation-url }}" \
             --arg release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
             '[{version: $v, date: $date, commit: $commit, sri: $sri, url: $url, attestation: $attestation, release: $release,
                checks: ["codeql", "semgrep", "no-deps"]}] + map(select(.version != $v))' versions.json > versions.new.json
          put "versions.json" versions.new.json "application/json; charset=utf-8" "public, max-age=300"
