# Security checks for the widget. Run by ci.yml on every change and by release.yml before a release;
# any finding blocks the release.
name: checks

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # only our own code ships to the browser: no runtime dependencies
      - name: No runtime dependencies
        run: |
          n=$(jq '.dependencies // {} | length' package.json)
          [ "$n" = "0" ] || { echo "package.json has $n runtime dependencies"; exit 1; }

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Semgrep
        run: pipx run semgrep scan --config p/javascript --config p/typescript --error --metrics=off src

      # only src/ ships to shops; the dev server and dev/, scripts/ run locally only
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths: [src]

      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      # findings show up in the Security tab; fail here too so they block the release
      - name: No CodeQL findings
        run: |
          n=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          [ "$n" = "0" ] || { echo "CodeQL found $n issues"; exit 1; }
